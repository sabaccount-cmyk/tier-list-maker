<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a21">
<title>ティア表メーカー</title>
<style>
:root{
  --bg:#171a21; --panel:#20242e; --row:#1c1f27; --line:#343a47;
  --ink:#e9ecf3; --sub:#9aa3b5; --accent:#6ea8ff; --size:104px; --lw:120px; --page:1180px; --bw:3px;
  --font:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
main{max-width:var(--page);margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
#title{flex:1 1 280px;min-width:0;font:800 26px/1.3 var(--font);color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);padding:4px 2px}
#title:focus{border-color:var(--accent);outline:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent)}
button:disabled{opacity:.35;cursor:default}
button:disabled:hover{border-color:var(--line)}
.primary{background:var(--accent);border-color:var(--accent);color:#0c1426;font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.size{display:flex;gap:6px;align-items:center;color:var(--sub);font-size:12px}
.size input[type=number],dialog input[type=number]{width:78px;padding:5px 6px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
.chip{display:inline-block;min-width:3em;text-align:center;padding:1px 10px;border-radius:4px;font-weight:700}
.plan{list-style:none;margin:0;padding:0;max-height:38vh;overflow:auto}
.plan li{padding:3px 0}
#msg{min-height:1.5em;color:var(--sub);font-size:13px;margin:0 0 8px}

.tier{display:flex;border:var(--bw) solid var(--tc,var(--line));margin-bottom:6px;background:var(--row)}
.t-label{width:var(--lw);flex:none;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;padding:6px}
.t-label input{width:100%;background:transparent;border:0;color:inherit;text-align:center;font:800 22px/1.2 var(--font);padding:4px 0}
.t-label input:focus-visible{outline-color:currentColor}
.zone{flex:1;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px;min-height:calc(var(--size) + 50px)}
.t-ctl{width:46px;flex:none;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;border-left:1px solid var(--line);padding:4px}
.t-ctl button{padding:1px 0;width:30px;font-size:12px}
.t-ctl input[type=color]{width:30px;height:24px;padding:0;border:1px solid var(--line);background:none;border-radius:4px;cursor:pointer}

.pool{margin-top:20px;border:1px solid var(--line);background:var(--panel);border-radius:6px}
.pool h2{margin:0;padding:10px 12px 0;font-size:14px;color:var(--sub);font-weight:600}
#pool:empty::before{content:"画像を追加するかここにドラッグ&ドロップしてください";color:var(--sub);padding:12px}

.card{width:var(--size)}
.thumb{position:relative;width:var(--size);height:var(--size);cursor:grab;touch-action:none;user-select:none;border-radius:4px;background:#0e1015}
.thumb img{width:100%;height:100%;padding:2px;box-sizing:border-box;object-fit:contain;display:block;border-radius:4px;pointer-events:none}
.card .x{display:none;position:absolute;top:3px;right:3px;width:22px;height:22px;padding:0;line-height:1;border-radius:50%;background:rgba(0,0,0,.7);font-size:11px}
.card:hover .x,.card:focus-within .x{display:block}
.card input{width:100%;margin-top:4px;padding:3px 4px;font:11px/1.3 var(--font);text-align:center;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px}
.card.dragging{opacity:.35}
.zone.over{outline:2px dashed var(--accent);outline-offset:-2px}
.card.drop-before{box-shadow:-5px 0 0 -1px var(--accent)}
.zone.drop-end{box-shadow:inset -5px 0 0 -1px var(--accent)}
.t-ctl .t-grip{cursor:grab;touch-action:none;letter-spacing:-2px;font-weight:700}
.tier.dragging{opacity:.3}
.tier.tb{box-shadow:0 -4px 0 0 var(--accent)}
.tier.ta{box-shadow:0 4px 0 0 var(--accent)}
.ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.88;box-shadow:0 8px 24px rgba(0,0,0,.5);margin:0}
.ghost .x{display:none!important}
body.dragging-now,body.dragging-now *{user-select:none;cursor:grabbing!important}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:18px;width:min(760px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.65)}
.cmp-head{display:flex;gap:12px;align-items:center;color:var(--sub);font-size:13px}
.cmp-bar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.cmp-bar i{display:block;height:100%;background:var(--accent)}
.cmp-q{text-align:center;font-weight:700;margin:14px 0 10px}
.cmp-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;background:var(--row)}
.cmp-card img{width:100%;max-height:46vh;aspect-ratio:1;object-fit:contain;background:#0e1015;border-radius:6px}
.cmp-card span{word-break:break-all;text-align:center}
.cmp-foot{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.cmp-hint{text-align:center;color:var(--sub);font-size:12px;margin:10px 0 0}
.res{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.res h3{margin:0 0 6px;font-size:14px}
.res ol,.res ul{margin:0;padding-left:1.4em;max-height:46vh;overflow:auto}
.res ul{list-style:none;padding:0}
.res li{padding:2px 0;word-break:break-all}
.res small{color:var(--sub)}
@media (max-width:620px){.res,.cmp-pair{grid-template-columns:1fr}}
.pv{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 10px 8px;background:var(--row)}
.pv-h{position:sticky;top:0;z-index:1;margin:6px 0 2px;padding:4px 0;background:var(--row)}
.pv-i{display:flex;align-items:center;gap:8px;padding:2px 0}
.pv-i img{width:28px;height:28px;background:#0e1015;object-fit:contain;border-radius:3px;flex:none}
.pv-n{width:2.6em;text-align:right;color:var(--sub);flex:none}
.pv-name{flex:1;min-width:0;word-break:break-all}
.pv small,.pv-h small{color:var(--sub)}
/* 色パネル */
.t-ctl .t-color{width:30px;height:24px;padding:0;border-radius:4px;border:1px solid var(--line);cursor:pointer}
#colorpop{position:fixed;z-index:1100;width:232px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cp-sw{height:34px;padding:0;border:2px solid transparent;border-radius:6px;font-size:12px;font-weight:700;color:#111}
.cp-sw.on{border-color:var(--ink)}
.cp-custom{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--sub);font-size:12px}
.cp-custom input{width:44px;height:26px;padding:0;border:1px solid var(--line);background:none;cursor:pointer}
/* 画像名(最大2行。フォーカス中は4行まで) */
.cname{position:relative;margin-top:4px}
.card textarea{display:block;width:100%;margin:0;padding:3px 4px;font:12px/1.4 var(--font);text-align:center;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;resize:none;overflow:hidden;word-break:break-all;white-space:pre-wrap}
.cname.more::after{content:"…";position:absolute;right:3px;bottom:2px;padding:0 2px;background:var(--bg);color:var(--accent);font-size:12px;line-height:1;pointer-events:none}
/* 未配置の削除 */
.pool-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px 0}
.pool-head h2{padding:0;margin:0 auto 0 0}
.pool-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pool-tools button{padding:4px 10px;font-size:13px}
.danger{border-color:#c0504d;color:#ff9c98}
.danger:hover:not(:disabled){background:#c0504d;color:#fff;border-color:#c0504d}
.sel-n{color:var(--accent);font-size:13px}
.sel-hint{flex-basis:100%;color:var(--sub);font-size:12px}
.card.sel .thumb{outline:3px solid var(--accent);outline-offset:-3px}
.card.sel .thumb::after{content:"✓";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#0c1426;font-weight:800;text-align:center;line-height:22px}
body.selmode .thumb{cursor:pointer}
body.selmode .card.sel .thumb{cursor:grab}
body.selmode main{padding-bottom:120px}
#marquee{position:fixed;z-index:900;border:1px solid var(--accent);background:rgba(110,168,255,.18);pointer-events:none}
.cmp-opt{margin:12px auto;max-width:540px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--row)}
.cmp-opt label{display:flex;gap:8px;align-items:center}
.newbadge{background:var(--accent);color:#0c1426;border-radius:4px;padding:0 6px;font-size:11px;font-weight:700;flex:none}
.cmp-card .newbadge{align-self:center}
#savedto,#autosaved,.tally{color:var(--sub);font-size:12px}
.cp-grid{max-height:176px;overflow-y:auto;gap:8px;padding:6px}
.cp-item{position:relative}
.cp-item .cp-sw{width:100%}
.cp-del{position:absolute;top:-6px;right:-6px;width:18px;height:18px;padding:0;border-radius:50%;font-size:11px;line-height:1;display:none;background:var(--bg)}
.cp-item:hover .cp-del,.cp-item:focus-within .cp-del{display:block}
.cp-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.cp-row .cp-custom{margin-top:0}
.cp-row button{padding:4px 8px;font-size:12px}
#colorpop{width:268px}
dialog .cnt-in{width:64px;padding:2px 6px}
dialog .cnt-in.fx{border-color:var(--accent)}
.cmp-warn{color:#e6b450;font-size:12px;margin:6px 0 0}
.t-count{font-size:12px;opacity:.75;line-height:1.2}
.tally{margin:0 0 8px}
#sq{width:170px;padding:6px 8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
#poolsort{padding:4px 6px;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.card.dim{opacity:.25}
.card.hit .thumb{outline:3px solid #ffd54a;outline-offset:-3px}
.restore{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;margin-bottom:12px;border:1px solid var(--accent);border-radius:8px;background:var(--panel)}
.restore[hidden]{display:none}
.restore small{color:var(--sub)}
#selbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:800;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:calc(100vw - 24px);padding:10px 14px;background:var(--panel);border:1px solid var(--accent);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#selbar[hidden]{display:none}
#selbar select{padding:6px 8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
.ghost-n{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--accent);color:#0c1426;text-align:center;line-height:22px;font-weight:800;font-size:12px}
.size select{padding:5px 6px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
#lb{width:min(94vw,980px)}
.lb-topnav{display:flex;gap:6px}
.lb-top{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:13px;margin-bottom:8px}
.lb-img{display:block;width:100%;height:58vh;object-fit:contain;background:#0e1015;border-radius:6px}
.lb-cap{margin:10px 0 0;text-align:center;font-weight:700;word-break:break-all}
.lb-sub{margin:2px 0 0;text-align:center;color:var(--sub);font-size:12px}
#ex-pv{width:100%;margin-top:10px;padding:8px;font:13px/1.5 var(--font);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;resize:vertical}
.dd{position:relative;display:inline-block}
.dd-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:700;min-width:210px;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dd-menu[hidden]{display:none}
.dd-menu button{text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px}
.dd-menu button:hover{background:var(--bg)}
.dd-menu button[hidden]{display:none}
.dd-menu.panel{min-width:320px;gap:10px;padding:14px;max-height:80vh;overflow:auto}
.dd-menu.panel .size{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}
.dd-menu.panel button[data-dd-close]{align-self:flex-end;border:1px solid var(--line)}
.dd-hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
#genretext{width:100%;padding:6px 8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
#genretext::placeholder{color:var(--sub);opacity:.55}
.rate{position:absolute;right:3px;bottom:3px;max-width:calc(100% - 6px);padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.7);line-height:1.25;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.lb-body{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
.lb-side h3{margin:12px 0 6px;font-size:14px}
.lb-side h3:first-child{margin-top:0}
.lb-tags{display:flex;flex-wrap:wrap;margin-bottom:6px}
.tagchip{display:inline-flex;align-items:center;gap:2px;margin:0 4px 4px 0;padding:2px 4px 2px 10px;background:var(--bg);border:1px solid var(--line);border-radius:999px;font-size:13px}
.tagchip button{border:0;background:transparent;padding:0 5px;color:var(--sub);cursor:pointer}
#lb-tag{width:100%;padding:6px 8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
.lb-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.lb-row input{width:92px;padding:4px 6px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit;text-align:right}
.lb-total{display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:14px}
.rl-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.rl-row input[type=number]{width:78px;padding:3px 6px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
.rl-row input[type=color]{width:40px;height:26px;padding:0;border:1px solid var(--line);background:none}
.rate-demo{display:inline-block;margin:0 6px 6px 0;padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.7);font-weight:700}
@media (max-width:700px){.lb-body{grid-template-columns:1fr}.lb-img{height:40vh}}
/* メニュー内のボタンをボタンらしく(「並べ替える」は青く塗る) */
.dd-menu.panel button{border:1px solid var(--line);text-align:center}
.dd-menu button.primary,.dd-menu.panel button.primary{background:var(--accent);border:1px solid var(--accent);color:#0c1426;font-weight:700;text-align:center}
.dd-menu button.primary:hover{filter:brightness(1.08);background:var(--accent)}
/* 色ボタン(ランク・総合評価の文字・点数ルールで共通) */
.colorbtn{width:30px;height:24px;padding:0!important;border-radius:4px;border:1px solid var(--line)!important;cursor:pointer;vertical-align:middle}
.cp-ren{position:absolute;top:-6px;left:-6px;width:18px;height:18px;padding:0;border-radius:50%;font-size:10px;line-height:1;display:none;background:var(--bg)}
.cp-item:hover .cp-ren,.cp-item:focus-within .cp-ren{display:block}
#cpn{width:74px;padding:3px 6px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
#colorpop{width:304px}
.rl-stat{margin:8px 0 0;font-size:13px;color:var(--sub)}
.size[hidden],.rateopts[hidden]{display:none}
.rateopts{display:flex;flex-direction:column;gap:10px}
#colorpop .cp-head{padding:2px 30px 4px 2px;font-size:12px;color:var(--sub)}
#colorpop .cp-x{position:absolute;top:6px;right:6px;width:24px;height:24px;padding:0;border-radius:50%;line-height:1;background:transparent;border:1px solid var(--line)}
#colorpop .cp-x:hover{border-color:var(--accent)}
.cp-sw.locked{cursor:default}
[hidden]{display:none!important}
.dup-list{max-height:56vh;overflow:auto;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.dup-group{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--row)}
.dup-head{margin-bottom:6px;font-size:13px}
.dup-head small{color:var(--sub)}
.dup-items{display:flex;flex-wrap:wrap;gap:10px}
.dup-card{width:150px;display:flex;flex-direction:column;gap:4px;font-size:12px;cursor:pointer}
.dup-card img{width:150px;height:150px;object-fit:contain;background:#0e1015;border-radius:6px}
.dup-name{word-break:break-all;font-weight:700}
.dup-card small{color:var(--sub)}
.dup-chk{display:flex;gap:6px;align-items:center}
.t-ctl{margin-left:auto}
body.hascols .tier .zone{max-width:calc(var(--cols) * (var(--size) + 8px) + 8px)}
body.hascols main{min-width:var(--page)}
.fitmode{display:flex;flex-direction:column;gap:4px;margin:-4px 0 0;padding-left:2px;font-size:12px;color:var(--sub)}
.fitmode label{display:flex;gap:6px;align-items:center}
.panel-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rev-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.rev-bar input{flex:1 1 180px;padding:6px 8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
.rev-list{max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:6px}
.rev-row{display:grid;grid-template-columns:3em minmax(0,1fr) auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);font-size:12px}
.rev-c{display:flex;gap:6px;align-items:center;min-width:0}
.rev-c img{width:36px;height:36px;object-fit:contain;background:#0e1015;border-radius:4px;flex:none}
.rev-c span{word-break:break-all}
.rev-r{display:flex;gap:4px;align-items:center}
.rev-r button{padding:3px 8px;font-size:12px}
.rev-r button.on{background:var(--accent);border-color:var(--accent);color:#0c1426;font-weight:700}
.rev-n{color:var(--sub);text-align:right}
@media (max-width:700px){.rev-row{grid-template-columns:2em 1fr}}
.set-h{margin-top:2px;font-size:12px;font-weight:700;color:var(--sub)}
.bk-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bk-row input[type=text],.bk-row select{padding:5px 8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
.bk-row input[type=text]{flex:1 1 150px;min-width:0}
.bk-sc{display:grid;grid-template-columns:1fr 96px auto;gap:6px 8px;align-items:center;font-size:13px}
.bk-sc select,.bk-sc input{padding:4px 6px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
.bk-sc input{text-align:right}
.bk-msg{min-height:1.4em;margin:4px 0;color:var(--accent);font-size:13px;text-align:center}
.bk-prev{margin:4px 0;max-height:120px;overflow:auto;font-size:12px;color:var(--sub)}
#bulkdlg h3,#statdlg h3{margin:12px 0 4px;font-size:14px}
#bulkdlg{width:min(94vw,740px)}
#statdlg{width:min(96vw,980px)}
.stat-wrap{overflow:auto;max-height:30vh;border:1px solid var(--line);border-radius:6px}
.stat-t{border-collapse:collapse;width:100%;font-size:13px}
.stat-t th,.stat-t td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.stat-t th:first-child,.stat-t td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}

<script>
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FONT = '"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif';

const DEFAULT_TIERS = [["S","#ff7f7f"],["A","#ffbf7f"],["B","#ffdf7f"],["C","#bfff7f"],["D","#7fbfff"]];
const DEFAULT_PRESETS = [["赤", "#ff7f7f"], ["橙", "#ffbf7f"], ["黄", "#ffdf7f"], ["緑", "#bfff7f"], ["青", "#7fbfff"], ["藍", "#8f8fff"], ["紫", "#bf7fff"], ["白", "#ffffff", 1]]
  .map(([name, color, noCycle]) => ({ name, color, locked: true, ...(noCycle ? { noCycle: true } : {}) }));   // 初期の色:変更・削除はできない。白はランクの自動の色の巡回には入れない
function validPresets(a) {
  if (!Array.isArray(a)) return null;
  const r = a.filter(p => p && /^#[0-9a-f]{6}$/i.test(p.color)).map(p => ({ name: String(p.name || "").slice(0, 4), color: p.color.toLowerCase() }));
  return r.length ? r : null;
}
// 初期の色(ロック)を先頭に置きそのあとに追加した色を並べる。同じ色は初期の色にまとめる
function normalizePresets(list) {
  const defs = DEFAULT_PRESETS.map(p => ({ ...p })), seen = new Set(defs.map(p => p.color)), custom = [];
  for (const p of (list || [])) {
    if (!p || !/^#[0-9a-f]{6}$/i.test(p.color)) continue;
    const c = p.color.toLowerCase();
    if (seen.has(c)) continue;
    seen.add(c); custom.push({ name: String(p.name || "").slice(0, 4), color: c });
  }
  return [...defs, ...custom];
}
function loadPresets() {   // 以前の「ランク用」と「文字用」の2つの保存内容も1つにまとめて引き継ぐ
  let a = null, b = null;
  try { a = validPresets(JSON.parse(localStorage.getItem("tl_presets"))); } catch (e) {}
  try { b = validPresets(JSON.parse(localStorage.getItem("tl_textpresets"))); } catch (e) {}
  return normalizePresets([...(a || []), ...(b || [])]);
}
function savePresets() { try { localStorage.setItem("tl_presets", JSON.stringify(state.presets)); } catch (e) {} }
let state = {
  title: "◯◯のティア表",
  tiers: DEFAULT_TIERS.map(([name, color]) => ({ id: uid(), name, color, items: [] })),
  pool: [],
  cards: {},
  labelW: 120,
  tableW: 1180,
  cardSize: 104,
  borderW: 3,
  presets: loadPresets(),
  imgMax: 720,
  png: { title: true, names: true, counts: true, pool: true, genre: true, rate: true, cell: "auto", scale: 2, bg: "dark", bgColor: "#ffffff" },
  perRow: null,
  fitMode: "width",
  genre: { type: "none", text: "" },
  rate: { show: false, size: 12, color: "#ffd54a", useRules: false, rules: [], lbTotal: true, lbItems: true, lbBtn: true, showKey: "total" }
};
let dragId = null, dirty = false;

const tierNameOf = id => (state.tiers.find(t => t.items.includes(id)) || { name: "未配置" }).name;
function moveMsg(ids, from, to) {   // 「名前」をSからAに移動しました
  const uniq = [...new Set(from)];
  if (uniq.length === 1 && uniq[0] === to) return ids.length === 1 ? `「${state.cards[ids[0]].name}」の位置を変えました` : `${ids.length}枚の位置を変えました`;
  if (ids.length === 1) return `「${state.cards[ids[0]].name}」を${from[0]}から${to}に移動しました`;
  return uniq.length === 1 ? `${ids.length}枚を${uniq[0]}から${to}に移動しました` : `${ids.length}枚を${to}に移動しました`;
}
function FSDEF() {   // 文字サイズの、初めの大きさ
  const keep = fsSheet2.textContent; fsSheet2.textContent = "";
  const ta = document.querySelector(".card textarea");
  const r = { fs_title: Math.round(parseFloat(getComputedStyle($("#title")).fontSize)), fs_hit: Math.round(parseFloat(getComputedStyle($("#hitpos")).fontSize)), fs_name: ta ? Math.round(parseFloat(getComputedStyle(ta).fontSize)) : 12 };
  fsSheet2.textContent = keep; return r;
}
const rateKeyOpts = sel => `<option value="total" ${!sel || sel === "total" ? "selected" : ""}>総合評価</option>` + GENRES[state.genre.type].items.map(([k, l]) => `<option value="${k}" ${sel === k ? "selected" : ""}>${esc(l)}</option>`).join("");
function say(t) { if (replName) t = maskNames(t); $("#msg").textContent = t; }
var replName = false;   // 動作の説明で、名前を「画像」に置き換えるか
function maskNames(t) {
  const names = [...new Set(Object.values(state.cards).map(c => c.name).filter(Boolean))].sort((a, b) => b.length - a.length);
  let out = String(t); for (const n of names) out = out.split("「" + n + "」").join("「画像」");
  return out;
}
function ink(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#111" : "#fff";
}

/* ---------- 描画 ---------- */
function cardHtml(id) {
  const c = state.cards[id];
  if (!c) return "";
  return `<div class="card${selMode && selected.has(id) ? " sel" : ""}" data-id="${id}">
    <div class="thumb" title="右クリックで拡大"><img src="${imgUrl(c)}" alt="" loading="lazy" decoding="async">${rateBadge(c)}</div>
    <div class="cname"><textarea rows="1" data-act="cname" aria-label="画像の名前" spellcheck="false" title="${esc(c.name)}">${esc(c.name)}</textarea></div>
  </div>`;
}
function render() {
  closePop();
  $("#tiers").innerHTML = state.tiers.map((t, i) => `
    <div class="tier" data-t="${t.id}" style="--tc:${t.border || t.color}">
      <div class="t-label" style="background:${t.color};color:${ink(t.color)}">
        <input type="text" value="${esc(t.name)}" data-act="tname" aria-label="ティア名" spellcheck="false"><div class="t-count">${t.items.length} 枚</div>
      </div>
      <div class="zone" data-zone="${t.id}">${t.items.map(cardHtml).join("")}</div>
      <div class="t-ctl">
        <button class="t-grip" title="ドラッグでランクごと並べ替え" aria-label="ランクを移動">⋮⋮</button>
        <button class="t-color colorbtn" data-act="tcolor" style="background:${t.color}" title="色を変える" aria-label="ティアの色"></button>
        <button data-act="up" title="上へ" ${i === 0 ? "disabled" : ""}>↑</button>
        <button data-act="down" title="下へ" ${i === state.tiers.length - 1 ? "disabled" : ""}>↓</button>
        <button data-act="del" title="ティアを削除">✕</button>
      </div>
    </div>`).join("");
  $("#pool").innerHTML = state.pool.map(cardHtml).join("");
  renderPoolTools(); fitNames(); applySearch(); updateTally(); syncLimitUI();
}

/* ---------- 画像の追加 ---------- */
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  if (state.imgMax === 0) { bmp.close && bmp.close(); return await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); }); }   // フル:圧縮しない
  const max = state.imgMax || 720, r = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * r));
  c.height = Math.max(1, Math.round(bmp.height * r));
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  return c.toDataURL("image/webp", 0.9);
}
async function addFiles(files) {
  const imgs = [...files].filter(f => f.type.startsWith("image/") || IMG_EXT.test(f.name));
  let ok = 0;
  const PAR = 4;   // 4枚ずつ同時に縮小する

    if (o.title) { ctx.textAlign = "right"; ctx.fillText(fit(ctx, `ジャンル:${L.gl}`, 260), W - 20, TITLE / 2); }
    else { ctx.textAlign = "left"; ctx.fillText(fit(ctx, `ジャンル:${L.gl}`, W - 40), 20, TITLE / 2); }
  }
  let y = TITLE;
  for (let ti = 0; ti < rows.length; ti++) {
    const t = rows[ti];
    await loadRow(t);
    const h = heights[ti], bw = state.borderW;
    ctx.fillStyle = th.row; ctx.fillRect(0, y, W, h);
    ctx.fillStyle = t.color; ctx.fillRect(0, y, LW, h);
    if (bw) { ctx.strokeStyle = t.border; ctx.lineWidth = bw; ctx.strokeRect(bw / 2, y + bw / 2, W - bw, h - bw); }
    ctx.fillStyle = ink(t.color); ctx.textAlign = "center"; ctx.font = `800 26px ${FONT}`;
    const lines = wrap(ctx, t.name, LW - 20, 4), total = lines.length * 32 + (o.counts ? 24 : 0), top = y + h / 2 - total / 2;
    lines.forEach((ln, i) => ctx.fillText(ln, LW / 2, top + 16 + i * 32));
    if (o.counts) { ctx.font = `16px ${FONT}`; ctx.fillText(`${t.items.length} 枚`, LW / 2, top + lines.length * 32 + 12); }
    t.items.forEach((id, i) => {
      const im = imgs[id]; if (!im) return;
      const x = LW + PAD + (i % perRow) * (CELL + PAD), yy = y + PAD + Math.floor(i / perRow) * (CELL + CAP + PAD);
      ctx.fillStyle = th.thumb; ctx.fillRect(x, yy, CELL, CELL);
      const fk = Math.min((CELL - 4) / im.width, (CELL - 4) / im.height), dw = im.width * fk, dh = im.height * fk;
      ctx.drawImage(im, x + (CELL - dw) / 2, yy + (CELL - dh) / 2, dw, dh);
      if (o.rate) {
        const tot = (o.rateKey && o.rateKey !== "total") ? scoreOf(state.cards[id], o.rateKey) : totalOf(state.cards[id]);
        if (tot !== null) {
          const rs = rateStyle(tot), fs = Math.max(8, rs.size * CELL / Math.max(1, state.cardSize)), txt = String(tot);
          ctx.font = `700 ${fs}px ${FONT}`;
          const bw = Math.min(CELL - 6, ctx.measureText(txt).width + 8), bh = fs + 4;
          ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(x + CELL - bw - 3, yy + CELL - bh - 3, bw, bh);
          ctx.fillStyle = rs.color; ctx.textAlign = "center";
          ctx.fillText(fit(ctx, txt, bw - 6), x + CELL - bw / 2 - 3, yy + CELL - bh / 2 - 3 + 1);
        }
      }
      if (o.names) {
        ctx.fillStyle = th.text; ctx.font = `12px ${FONT}`; ctx.textAlign = "center";
        let ls = wrap(ctx, state.cards[id].name, CELL - 6, 99);
        if (ls.length > 2) ls = [ls[0], fit(ctx, ls.slice(1).join(""), CELL - 6)];
        ls.forEach((ln, k) => ctx.fillText(ln, x + CELL / 2, yy + CELL + 11 + k * 15));
      }
    });
    y += h + 6;
    t.items.forEach(id => { delete imgs[id]; });   // 行ごとに画像を手放してメモリを抑える
  }
  const blob = await new Promise(res => c.toBlob(res, "image/png"));
  if (!blob) throw new Error("toBlob");
  return { blob, reduced: L.reduced, S, shrunk: L.shrunk, CELL };
}

/* ---------- ティア名の自動命名 ---------- */
// Z→AAAZ→BAZZ→AAA のように1つ進める
function succ(s) {
  const a = s.split("");
  for (let i = a.length - 1; i >= 0; i--) {
    if (a[i] === "Z") a[i] = "A";
    else { a[i] = String.fromCharCode(a[i].charCodeAt(0) + 1); return a.join(""); }
  }
  return "A" + a.join("");
}
// 下から見て最後に「英大文字だけ」の名前を持つティアの次の名前。S だけのときは A から続ける
function nextTierName(tiers) {
  if (!tiers.length) return "S";
  let idx = -1;
  for (let i = tiers.length - 1; i >= 0; i--) if (/^[A-Z]+$/.test(tiers[i].name.trim())) { idx = i; break; }
  if (idx < 0) return "A";
  const last = tiers[idx].name.trim();
  return (last === "S" && idx === 0) ? "A" : succ(last);
}

// 赤・橙・黄・緑・青・藍・紫 を繰り返す。最後のティアの色の次の色を返す
function nextTierColor(tiers) {
  const cols = state.presets.filter(p => p.locked && !p.noCycle).map(p => p.color);   // 自動で付く色は初期の7色(赤〜紫)の巡回。追加した色や白は入れない
  if (!tiers.length) return cols[0];
  const i = cols.indexOf(String(tiers[tiers.length - 1].color).toLowerCase());
  return cols[(i >= 0 ? i + 1 : tiers.length) % cols.length];
}

/* ---------- 画像名の表示(最大2行。編集中は4行まで) ---------- */
function fitName(el) {
  const cs = getComputedStyle(el), lh = parseFloat(cs.lineHeight) || 16;
  const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const bd = parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
  const focused = document.activeElement === el;
  el.style.height = "auto";
  const need = el.scrollHeight + bd;
  el.style.height = Math.min(need, (focused ? 4 : 2) * lh + pad + bd) + "px";
  el.parentElement.classList.toggle("more", !focused && need > 2 * lh + pad + bd + 1);
}
function fitNames() {
  const els = [...document.querySelectorAll(".card textarea")];
  if (!els.length) return;
  const cs = getComputedStyle(els[0]), lh = parseFloat(cs.lineHeight) || 16;
  const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom), bd = parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
  els.forEach(el => { el.style.height = "auto"; });          // 書き込みだけ
  const need = els.map(el => el.scrollHeight + bd);           // 読み取りだけ(画面の再計算は1回)
  els.forEach((el, i) => {                                    // 書き込みだけ
    const focused = document.activeElement === el;
    el.style.height = Math.min(need[i], (focused ? 4 : 2) * lh + pad + bd) + "px";
    el.parentElement.classList.toggle("more", !focused && need[i] > 2 * lh + pad + bd + 1);
  });
}

    return { ids: d.ids, rows: clampN(d.rows, 1, MAX_ROWS, 5), pairs, res: d.res.split(""), i: d.res.length,
             prior: Array.isArray(d.prior) ? d.prior.map(k => d.ids[k]).filter(Boolean) : [],
             fixed: Array.isArray(d.fixed) ? d.fixed.map(v => Number.isInteger(v) && v >= 0 ? v : null) : [], tb: !!d.tb,
             acts: typeof d.acts === "string" && /^[as]*$/.test(d.acts) ? d.acts : "", sk: Array.isArray(d.sk) ? d.sk.filter(x => typeof x === "string") : [] };
  } catch (e) { return null; }
}
// 中断中に画像が増減していたら組み合わせを調整する(削除分は除き追加分は全員との対戦を末尾に足す)
function syncCmp() {
  const have = new Set(Object.keys(state.cards)), known = new Set(cmp.ids);
  const oldIds = cmp.ids.filter(id => have.has(id));
  const added = [...have].filter(id => !known.has(id));
  const removed = cmp.ids.length - oldIds.length;
  if (!added.length && !removed) return "";
  const pairs = [], res = [];
  cmp.pairs.forEach((p, k) => {
    if (!have.has(p[0]) || !have.has(p[1])) return;
    pairs.push(p);
    if (k < cmp.i) res.push(cmp.res[k]);
  });
  const extra = [];
  added.forEach((a, x) => { oldIds.forEach(b => extra.push([a, b])); added.slice(x + 1).forEach(b => extra.push([a, b])); });
  cmp.prior = (cmp.prior || []).filter(id => have.has(id));
  cmp.pairs = pairs.concat(orient(shuffle(extra)));
  cmp.res = res; cmp.i = res.length;
  cmp.ids = [...oldIds, ...added];
  cmp.rows = Math.min(cmp.rows, MAX_ROWS, cmp.ids.length); cmp.acts = "";
  touch(); updateCompareBtn();
  return `画像が増減していたため比較の組み合わせを調整しました(追加 ${added.length} 枚削除 ${removed} 枚)`;
}

// 行数 view.rows に合わせた各ランクの名前・色・枚数の計画(今のティアを上から流用し足りない分は新規)
// 枚数の割り振り:指定(固定)したランクを先に確定し残りを固定していないランクで均等に分ける
function planCounts(n, rows, fixed) {
  const cnt = new Array(rows).fill(null);
  let remain = n, clamped = false;
  for (let i = 0; i < rows; i++) if (fixed[i] != null) {
    cnt[i] = Math.min(fixed[i], remain);
    if (cnt[i] < fixed[i]) clamped = true;
    remain -= cnt[i];
  }
  const autos = cnt.map((c, i) => c === null ? i : -1).filter(i => i >= 0);
  let forced = false;
  if (!autos.length) { if (remain > 0) { cnt[rows - 1] += remain; forced = true; } }
  else { const base = Math.floor(remain / autos.length), rem = remain % autos.length; autos.forEach((i, k) => cnt[i] = base + (k < rem ? 1 : 0)); }
  const note = clamped ? "指定した枚数の合計が画像の枚数を超えているため後ろのランクの枚数を減らしました"
    : forced ? "すべてのランクに枚数を指定したので合計が合うようにいちばん下のランクの枚数を増やしました" : "";
  return { cnt, note };
}
// 行数 view.rows に合わせた各ランクの名前・色・枚数の計画(今のティアを上から流用し足りない分は新規)
function planRows() {
  const n = view.ids.length, rows = view.rows, fixed = view.fixed || [], list = [];
  const { cnt, note } = planCounts(n, rows, fixed);
  for (let i = 0; i < rows; i++) {
    const ex = state.tiers[i];
    list.push({ ex, name: ex ? ex.name : nextTierName(list), color: ex ? ex.color : nextTierColor(list), count: cnt[i], fixed: fixed[i] != null });
  }
  list.note = note;
  return list;
}
const cntInput = (t, i, n) => `<input class="cnt-in${t.fixed ? " fx" : ""}" type="number" min="0" max="${n}" value="${t.count}" data-i="${i}" aria-label="${esc(t.name)}の枚数"> 枚`;
function refreshPlan() { if ($("#pv")) $("#pv").innerHTML = previewHtml(); else if ($("#plan")) $("#plan").innerHTML = planHtml(); }
function removedHtml() {
  const removed = state.tiers.slice(view.rows);
  return removed.length ? `<p class="cmp-hint" style="text-align:left">反映すると次のティアは削除されます:${removed.map(t => esc(t.name)).join("・")}</p>` : "";
}
const chip = t => `<span class="chip" style="background:${t.color};color:${ink(t.color)}">${esc(t.name)}</span>`;
function planHtml() {
  const list = planRows(), n = view.ids.length;
  return `<ul class="plan">${list.map((t, i) => `<li>${chip(t)} ${cntInput(t, i, n)}${t.ex ? "" : " <small>(新しく追加)</small>"}${t.fixed ? " <small>(固定)</small>" : ""}</li>`).join("")}</ul>` +
    (list.note ? `<p class="cmp-warn">${list.note}</p>` : "") + removedHtml();
}
function rowsHtml() {
  const max = Math.min(MAX_ROWS, view.ids.length);
  return `<label class="size">ランクの行数 <input id="rows" type="number" min="1" max="${max}" value="${view.rows}"> 行(1〜${max})</label>`;
}
function setupView() {
  const ids = readingOrder();                                                       // 表の左上から順そのあとに未配置
  const prior = state.tiers.flatMap(t => t.items).filter(id => state.cards[id]);
  const canIns = ids.length - prior.length >= 1 && prior.length >= 1;
  const n = ids.length;
  return { ids, rows: Math.min(state.tiers.length, MAX_ROWS, n), prior,
           useWin: prior.length >= 3, win: Math.min(10, Math.max(1, prior.length - 1)),
           canIns, mode: canIns ? "ins" : "full", fixed: [],
           method: "csort", K: 5, R: Math.max(1, Math.min(n - 1, Math.ceil(Math.log2(Math.max(2, n))) + 3)) };
}
function mergeMax(n) {   // 併合の手順どおりに数えたいちばん多い場合の回数
  let runs = Array(n).fill(1), w = 0;
  while (runs.length > 1) {
    const nx = [];
    for (let i = 0; i < runs.length; i += 2) {
      if (i + 1 < runs.length) { w += runs[i] + runs[i + 1] - 1; nx.push(runs[i] + runs[i + 1]); } else nx.push(runs[i]);
    }
    runs = nx;
  }
  return w;
}
function methodHtml() {
  const m = view.method, n = view.ids.length;
  const r = (v, label, desc) => `<label><input type="radio" name="method" value="${v}" ${m === v ? "checked" : ""}> ${label}</label>
      <p class="cmp-hint" style="text-align:left;margin:-4px 0 0 24px">${desc}</p>`;
  return `<div class="cmp-opt">
      ${r("csort", "整列+近所の確認(おすすめ)", "まず少ない回数で並べ替えます。そのあと並びが近いカード同士を改めて比べて並びの間違いを直します。確認する枚数を増やすほど正確になりますが回数も増えます")}
      <label class="size" style="margin-left:24px">前後 <input id="kk" type="number" min="1" max="10" value="${view.K}" ${m === "csort" ? "" : "disabled"}> 枚と確認する</label>
      ${r("sort", "整列のみ(いちばん少ない回数)", "「どちらが上か」だけで並べ替えます。回数は最少ですが1回の判断ミスがそのまま順位に響きます")}
      ${r("swiss", "スイス式", "成績の近いカード同士をラウンドごとに当てます。判断のミスに強く上位と下位がはっきり分かれます。真ん中あたりの細かい順位はラウンドを増やすほど安定します(回数も増えます)")}
      <label class="size" style="margin-left:24px">ラウンド数 <input id="rr" type="number" min="1" max="${Math.max(1, n - 1)}" value="${view.R}" ${m === "swiss" ? "" : "disabled"}> 回</label>
    </div>`;
}
function reduceText() {
  const n = view.ids.length, full = n * (n - 1) / 2, m = view.method;
  const avg = Math.max(n - 1, Math.round(n * Math.log2(Math.max(2, n)) - 1.25 * n)), mx = mergeMax(n);
  let t;
  if (m === "swiss") t = `${view.R} ラウンド × 約 ${Math.floor(n / 2)} 組 = 約 ${view.R * Math.floor(n / 2)} 回`;
  else if (m === "sort") t = `約 ${avg} 回(多くても ${mx} 回)`;
  else { const ver = view.K * n - view.K * (view.K + 1) / 2; t = `並べ替えで約 ${avg} 回(多くても ${mx} 回)そのあとの確認で最大 ${ver} 回(比べ済みの組は省かれます)`; }
  return `${n} 枚の画像を1対1で比べます。比較は${t}です(全員で総当りなら ${full} 回)`;
}

$("#compare").onclick = () => {
  if (Object.keys(state.cards).length < 2) { say("比較するには画像が2枚以上必要です"); return; }
  if (!state.tiers.length) { say("ティアが1つ以上必要です"); return; }
  if (ad) { const note = syncAd(); if (note) say(note); }
  if (ad) { dlg.showModal(); renderAdProgress(); return; }
  if (ins) { const note = syncIns(); if (note) say(note); }
  if (ins) { dlg.showModal(); renderInsProgress(); return; }

    const note = syncCmp();

    view = cmp; dlg.showModal(); renderProgress();

    view = setupView(); dlg.showModal(); renderSetup();

};

function renderCmp() {
  if (cmp.i >= cmp.pairs.length) return renderProgress();
  dlg.dataset.screen = "run";
  const { pairs, i } = cmp;
  const A = state.cards[pairs[i][0]], B = state.cards[pairs[i][1]];

  dlg.innerHTML = `
    <div class="cmp-head"><span>${i + 1} / ${pairs.length}</span><div class="cmp-bar"><i style="width:${i / pairs.length * 100}%"></i></div></div>

}
// 現在の順位(勝率の高い順。未対戦は最後)
function standings(c = cmp) {
  const sc = {}, gp = {}, opp = {};
  c.ids.forEach(id => { sc[id] = 0; gp[id] = 0; opp[id] = []; });
  for (let k = 0; k < c.i; k++) {
    const [a, b] = c.pairs[k], r = c.res[k];
    gp[a]++; gp[b]++; opp[a].push(b); opp[b].push(a);
    if (r === "a") sc[a] += 1; else if (r === "b") sc[b] += 1; else { sc[a] += 0.5; sc[b] += 0.5; }
  }
  c.assumedN = 0;
  if (c.prior && c.prior.length > 1) {
    const P = c.prior.filter(id => id in sc);
    const seen = new Set(c.pairs.map(([a, b]) => a < b ? a + "|" + b : b + "|" + a));
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const a = P[i], b = P[j];
      if (seen.has(a < b ? a + "|" + b : b + "|" + a)) continue;
      sc[a] += 1; gp[a]++; gp[b]++; c.assumedN++;
    }
  }
  const rate = id => gp[id] ? sc[id] / gp[id] : -1;
  const bh = id => c.tb ? opp[id].reduce((t, o) => t + Math.max(0, rate(o)), 0) : 0;   // スイス式:同点なら対戦相手が強かった方を上に
  return c.ids.map((id, idx) => ({ id, idx, s: sc[id], g: gp[id] }))
    .sort((x, y) => rate(y.id) - rate(x.id) || y.g - x.g || bh(y.id) - bh(x.id) || x.idx - y.idx);
}
function previewHtml() {
  const list = planRows(), n = view.ids.length;

    const start = p, part = cmp.stats.slice(p, p + t.count); p += t.count;
    return `<div class="pv-h">${chip(t)} ${cntInput(t, i, n)}${t.ex ? "" : " <small>(新しく追加)</small>"}${t.fixed ? " <small>(固定)</small>" : ""}</div>` +
      part.map((o, k) => `<div class="pv-i"><span class="pv-n">${start + k + 1}</span><img src="${imgUrl(state.cards[o.id])}" alt=""><span class="pv-name">${esc(state.cards[o.id].name)}</span><small>${o.s} / ${o.g}</small></div>`).join("");
  }).join("") + (list.note ? `<p class="cmp-warn">${list.note}</p>` : "") + removedHtml();
}
// 中断中・完了後の画面(現在の順位プレビュー付き)
function renderProgress() {
  dlg.dataset.screen = "progress";
  const done = cmp.i >= cmp.pairs.length, total = cmp.pairs.length;
  const pct = total ? Math.floor(cmp.i / total * 100) : 100;
  cmp.stats = standings(); cmp.order = cmp.stats.map(o => o.id);
  dlg.innerHTML = `
    <div class="cmp-head"><span>${cmp.i} / ${total} 回(${pct}%)</span><div class="cmp-bar"><i style="width:${pct}%"></i></div></div>

    <div style="display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:8px">${rowsHtml()}<button data-cmp="evenly" style="padding:3px 10px;font-size:12px">均等に戻す</button></div>
    <div class="pv" id="pv">${previewHtml()}</div>
    <p class="cmp-hint" style="text-align:left;margin-top:6px">各ランクの枚数の欄を書き換えるとそのランクの枚数を固定できます(空にすると解除)。固定していないランクで残りを均等に分けます</p>
    <p class="cmp-hint" style="text-align:left">${cmp.assumedN ? `表の並びから省略した ${cmp.assumedN} 組は上にあるカードが勝ったものとして数えています` : ""}数字は「勝ち点 / 対戦数」です(引き分けは0.5点)。${done ? "同点は元の並び順です" : "途中経過は勝率(勝ち点÷対戦数)の高い順です。対戦数が少ない画像は順位がまだ動きます"}</p>
    <div class="cmp-foot">
      ${done
        ? `<button class="primary" data-cmp="apply">この結果を反映する</button><button data-cmp="undo">一つ戻る</button><button data-cmp="quit">反映せず閉じる</button>`
        : `<button class="primary" data-cmp="resume">続きから再開</button><button data-cmp="apply">途中結果を反映する</button><button data-cmp="quit">閉じる</button>`}
      <button data-cmp="review">比較を見直す</button><button data-cmp="restart">最初からやり直す</button>
    </div>
    ${done ? "" : `<p class="cmp-hint">「閉じる」を押しても進捗は残ります。「表を保存」で保存すればあとで読み込んで続きから再開できます</p>`}`;
}
function answer(r) {
  if (r === "u") { skipPair(); return; }
  const p = cmp.pairs[cmp.i], k = pkey(p[0], p[1]), ix = cmp.sk ? cmp.sk.indexOf(k) : -1;
  if (ix >= 0) cmp.sk.splice(ix, 1);   // 飛ばしていた組に答えた
  cmp.res[cmp.i] = r; cmp.i++; cmp.acts = (cmp.acts || "") + "a";
  touch(); renderCmp();
}
function skipPair() {   // 「わからない」:この組をいちばん最後に回す(最後にまとめて聞き直す)
  if (cmp.i >= cmp.pairs.length - 1) return;
  const p = cmp.pairs.splice(cmp.i, 1)[0];
  cmp.pairs.push(p);
  (cmp.sk = cmp.sk || []).push(pkey(p[0], p[1])); cmp.acts = (cmp.acts || "") + "s";
  touch(); updateCompareBtn(); renderCmp();
}
function cmpUndo() {   // 一つ戻る:直前が「わからない」ならその組を元の位置に戻す。答えならその答えを取り消す
  const acts = cmp.acts || "", last = acts.slice(-1);
  if (last === "s") {
    const p = cmp.pairs.pop();
    cmp.pairs.splice(cmp.i, 0, p);
    const ix = (cmp.sk || []).lastIndexOf(pkey(p[0], p[1])); if (ix >= 0) cmp.sk.splice(ix, 1);
    cmp.acts = acts.slice(0, -1);
  } else if (cmp.i > 0) { cmp.i--; cmp.res.length = cmp.i; if (last === "a") cmp.acts = acts.slice(0, -1); }
  else return;
  touch(); renderCmp();
}

// 変更のたびに(0.35秒まとめて)表の状態を履歴に記録する。削除した画像のデータは allCards に残す
let allCards = {}, hist = [], hpos = -1, snapTimer = 0;
function snapJSON() {

}
function updateUndoBtns() {

}
function takeSnap() {

}

// ブラウザの中のデータベース:「kv」に並びや名前などの小さい情報「imgs」に画像を1枚ずつ
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("tierlist-maker", 3);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
      if (!db.objectStoreNames.contains("imgs")) db.createObjectStore("imgs");
      if (!db.objectStoreNames.contains("vers")) db.createObjectStore("vers");
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const isReq = r => r && typeof r === "object" && typeof r.readyState === "string";
async function idbTx(stores, mode, fn) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    let out;
    const tx = db.transaction(stores, mode);
    tx.oncomplete = () => {
      db.close();
      res(isReq(out) ? out.result : (out && typeof out === "object") ? Object.fromEntries(Object.entries(out).map(([k, v]) => [k, isReq(v) ? v.result : v])) : out);
    };
    tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
    try { out = fn(tx); } catch (e) { rej(e); try { tx.abort(); } catch (e2) {} }
  });
}
const idbGetMeta = () => idbTx(["kv"], "readonly", tx => tx.objectStore("kv").get("autosave"));
const idbGetImgs = () => idbTx(["imgs"], "readonly", tx => { const st = tx.objectStore("imgs"); return { k: st.getAllKeys(), v: st.getAll() }; });

  const im = tx.objectStore("imgs");
  tx.objectStore("kv").put(meta, "autosave");
  add.forEach(([id, src]) => im.put(src, id));
  del.forEach(id => im.delete(id));
});

// 比較の組み合わせは数が多いので1本の数値の列にして保存する(復元のときに元の形に戻す)

}

  return { version: 2, savedDevice: device, ...rest, cardsMeta: cm, ...(withProgress ? { compare: packCmpFast(), insert: packIns(), adaptive: packAd(), quick: packQc() } : {}), savedAt: Date.now() };
}
// ブラウザの中に保存済みの画像(id)。画像は一度保存したら変わらないのでない画像だけを書き込む。
// 自動保存とバージョン(後述)で同じ画像を共有する。どちらからも使われなくなった画像だけを消す
let storedImgs = new Set(), storedLoaded = false;
async function ensureStored() {

async function idbClearAuto() {   // 自動保存の内容を消す(バージョンで使っている画像は残す)

/* ---------- 比較を減らして並べ替える(整列・整列+近所の確認・スイス式) ---------- */
// 答えの列(answers: "a"=前に書いた方が上 / "b"=後ろの方が上 / "d"=同じくらい)からいつでも状態を再現できる
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

function mergeReplay(x) {   // 下から順に併合する整列。表の並びが元から整っていると少ない回数で済む

  const pairs = [], res = []; let k = 0;
  while (runs.length > 1) {

      if (r + 1 >= runs.length) { next.push(runs[r]); continue; }
      const L = runs[r], R = runs[r + 1], out = [];
      let i = 0, j = 0;
      while (i < L.length && j < R.length) {
        if (k >= x.answers.length) return { done: false, pair: [L[i], R[j]], asked: k, pairs, res };
        const a = x.answers[k++];
        pairs.push([L[i], R[j]]); res.push(a);
        if (a === "b") out.push(R[j++]); else out.push(L[i++]);
      }
      next.push(out.concat(L.slice(i), R.slice(j)));

    runs = next;

}

  x.ids.forEach(id => { score[id] = 0; });

/* ---------- 重複・似た画像のチェック ---------- */
// 画像を 9×8 に縮めてとなり合う明るさの比べ方(64ビット)を指紋にする。縮小や色の少しの違いがあっても似た画像は近い指紋になる
const dupdlg = $("#dupdlg");
const hashCache = new Map();

async function cardHash(id) {
  const c = state.cards[id], hit = hashCache.get(id);
  if (hit && hit.src === c.src) return hit;
  const img = await loadImg(c.src);
  const mid = document.createElement("canvas"); mid.width = 36; mid.height = 32;
  const g1 = mid.getContext("2d"); g1.fillStyle = "#fff"; g1.fillRect(0, 0, 36, 32); g1.imageSmoothingQuality = "high"; g1.drawImage(img, 0, 0, 36, 32);
  const sm = document.createElement("canvas"); sm.width = 9; sm.height = 8;
  const g2 = sm.getContext("2d"); g2.imageSmoothingQuality = "high"; g2.drawImage(mid, 0, 0, 9, 8);

let dupLevel = "normal", dupGroups = [], dupBusy = false;
async function dupScan() {
  const ids = readingOrder(), hs = [];
  for (let i = 0; i < ids.length; i++) {

  }
  const lv = DUP_LEVELS[dupLevel], parent = ids.map((_, i) => i);

    const same = a.src === b.src || (!a.flat && !b.flat && popcnt(a.h1 ^ b.h1) + popcnt(a.h2 ^ b.h2) <= lv.d && Math.abs(Math.log(a.ratio / b.ratio)) < lv.r);
    if (same) parent[find(i)] = find(j);

  ids.forEach((id, i) => { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(id); });

// 残すほうの自動選び:ランクに入っている > タグ・評価がある > 画像のデータが大きい(きれい)
function bestToKeep(g) {
  const placed = id => state.tiers.some(t => t.items.includes(id)) ? 1 : 0;
  const hasData = id => { const c = state.cards[id]; return (c.tags && c.tags.length) || c.sc ? 1 : 0; };
  return g.slice().sort((a, b) => (placed(b) - placed(a)) || (hasData(b) - hasData(a)) || (state.cards[b].src.length - state.cards[a].src.length))[0];

}

    const mid = (lo + hi) >> 1;
    if (k >= x.answers.length) break;
    const r = x.answers[k++];
    steps.push([x.queue[qi], order[mid], r]);
    if (r === "a") hi = mid; else if (r === "b") lo = mid + 1; else lo = hi = mid + 1;

}

    ids.forEach(id => {
      const c = state.cards[id], cur = c.tags ? c.tags.slice() : []; let ch = false;

/* ---------- 集計(ランクごとの枚数・評価点数・タグの内訳) ---------- */
const statdlg = $("#statdlg");
function statData() {
  const g = GENRES[state.genre.type];
  const groups = [...state.tiers.map(t => ({ name: t.name, ids: t.items.filter(id => state.cards[id]) })), { name: "未配置", ids: state.pool.filter(id => state.cards[id]) }];
  const total = groups.reduce((t, x) => t + x.ids.length, 0);
  const avg = a => a.length ? a.reduce((t, v) => t + v, 0) / a.length : null;
  const f1 = v => v === null ? "—" : String(Math.round(v * 10) / 10);
  const secs = [], sT = !!g && state.rate.lbTotal !== false, sI = !!g && state.rate.lbItems !== false;
  secs.push({ title: "ランクごとの集計", head: ["ランク", "枚数", "割合", ...(sT ? ["総合評価の平均", "最大", "最小", "点数のある枚数"] : [])],
    rows: groups.map(x => {
      const row = [x.name, x.ids.length, total ? (Math.round(x.ids.length / total * 1000) / 10) + "%" : "—"];
      if (sT) { const t = x.ids.map(id => totalOf(state.cards[id])).filter(v => v !== null); row.push(f1(avg(t)), t.length ? Math.max(...t) : "—", t.length ? Math.min(...t) : "—", t.length); }
      return row;
    }).concat([["合計", total, total ? "100%" : "—", ...(sT ? ["", "", "", ""] : [])]]) });
  if (sI) {
    const rows = groups.map(x => [x.name, ...g.items.map(([k]) => f1(avg(x.ids.map(id => scoreOf(state.cards[id], k)).filter(v => v !== null))))]);
    const all = groups.flatMap(x => x.ids);
    rows.push(["全体", ...g.items.map(([k]) => f1(avg(all.map(id => scoreOf(state.cards[id], k)).filter(v => v !== null))))]);
    secs.push({ title: `評価の項目ごとの平均(${g.label})`, head: ["ランク", ...g.items.map(i => i[1])], rows });
  }
  const tagMap = new Map(), none = groups.map(() => 0);
  groups.forEach((x, gi) => x.ids.forEach(id => {
    const tg = state.cards[id].tags || [];
    if (!tg.length) none[gi]++;
    tg.forEach(t => { if (!tagMap.has(t)) tagMap.set(t, groups.map(() => 0)); tagMap.get(t)[gi]++; });
  }));
  const tagRows = [...tagMap.entries()].map(([t, a]) => [t, a.reduce((p, q) => p + q, 0), ...a]).sort((p, q) => q[1] - p[1] || p[0].localeCompare(q[0], "ja")).slice(0, 60);
  tagRows.push(["(タグなし)", none.reduce((p, q) => p + q, 0), ...none]);
  secs.push({ title: "タグの内訳(枚数の多い順・60個まで)", head: ["タグ", "合計", ...groups.map(x => x.name)], rows: tagRows });
  return secs;
}
const secTable = sec => `<h3>${esc(sec.title)}</h3><div class="stat-wrap"><table class="stat-t"><thead><tr>${sec.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${sec.rows.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
function statText(secs, sep) { return secs.map(sc => [sc.title, sc.head.join(sep), ...sc.rows.map(r => r.join(sep))].join("\n")).join("\n\n") + "\n"; }
function statCsv(secs) {
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  return secs.map(sc => [q(sc.title), sc.head.map(q).join(","), ...sc.rows.map(r => r.map(q).join(","))].join("\r\n")).join("\r\n\r\n");
}
$("#statBtn").onclick = () => {

  const secs = statData(), gl = genreLabel();
  statdlg.innerHTML = `
    <button class="vd-x" data-vx aria-label="閉じる">✕</button><p class="cmp-q">集計${gl ? `(ジャンル:${esc(gl)})` : ""}</p>
    ${secs.map(secTable).join("")}
    <div class="cmp-foot"><button class="primary" data-st="copy">コピー(Excelなどに貼れる形)</button><button data-st="csv">CSVで保存</button><button data-st="close">閉じる</button></div>`;

statdlg.addEventListener("click", async e => {

    try { const r = await writeOut(h, new Blob(["\ufeff" + statCsv(statData())], { type: "text/csv;charset=utf-8" }), name); say(`集計を保存しました${r === "download" ? "" : `(${r.name})`}`); }
    catch (err) { say("保存に失敗しました"); }

/* ---------- メニューの位置 ---------- */
function fitMenu(m) {
  if (m.classList.contains("wide")) {   // 広いパネル(設定)は画面の横の中央に置く。縦は開いたボタンの少し下
    const btn = document.querySelector(`[data-dd="${m.id}"]`), r = btn.getBoundingClientRect();
    const top = Math.max(8, Math.min(r.bottom + 6, innerHeight - 220));
    m.style.left = "50%"; m.style.transform = "translateX(-50%)"; m.style.top = top + "px"; m.style.maxHeight = (innerHeight - top - 12) + "px";
    return;
  }
  m.style.left = "";   // ふつうのメニューは画面の外にはみ出さないように横にずらす
  const r = m.getBoundingClientRect();
  let shift = 0;
  if (r.right > innerWidth - 8) shift = innerWidth - 8 - r.right;
  if (r.left + shift < 8) shift = 8 - r.left;
  if (shift) m.style.left = shift + "px";
}
addEventListener("resize", () => { const m = $("#menuSet"); if (m && !m.hidden) fitMenu(m); });

/* ---------- クイック分類モード ---------- */
// 画像を1枚ずつ大きく出して入れるランクを選ぶ。選び方は3つ:①数字キー・ランク名の文字キー ②ランク名のクリック ③矢印キーで選んでEnter
let qc = null;   // { total, queue: [これから分類する画像のid], log: [{t:"c"|"s", ...}], skips, cur(カーソルのあるランク) }
const qcdlg = $("#qcdlg");
const qcOpt = { scope: "pool", order: "keep" };
function locate(id) {
  const pi = state.pool.indexOf(id);
  if (pi >= 0) return { wh: "pool", ix: pi };
  for (const t of state.tiers) { const ix = t.items.indexOf(id); if (ix >= 0) return { wh: t.id, ix }; }
  return { wh: "pool", ix: state.pool.length };
}
function putAt(id, wh, ix) {
  removeFromAll(id);
  const list = wh === "pool" ? state.pool : (state.tiers.find(t => t.id === wh) || { items: state.pool }).items;
  list.splice(Math.min(ix, list.length), 0, id);
}
function packQc() { return qc ? { total: qc.total, queue: qc.queue, log: qc.log, skips: qc.skips, cur: qc.cur } : null; }
function unpackQc(d) {
  try {
    if (!d || !Array.isArray(d.queue) || !Array.isArray(d.log) || !d.queue.every(x => typeof x === "string")) return null;
    const log = d.log.filter(x => x && (x.t === "s" || x.t === "c") && typeof x.id === "string")
      .map(x => x.t === "s" ? { t: "s", id: x.id } : { t: "c", id: x.id, tid: String(x.tid), wh: String(x.wh), ix: Math.max(0, Math.round(+x.ix || 0)) });
    return { total: Math.max(d.queue.length, Math.round(+d.total) || d.queue.length), queue: d.queue, log, skips: Math.max(0, Math.round(+d.skips) || 0), cur: Math.max(0, Math.round(+d.cur) || 0) };
  } catch (e) { return null; }
}
function updateQcBtn() {
  const b = $("#qcBtn");
  if (!qc) b.textContent = "クイック分類";
  else if (!qc.queue.length) b.textContent = "クイック分類の結果";
  else b.textContent = `クイック分類を再開(${qc.total - qc.queue.length}/${qc.total})`;
}
// キーの割り当て:1〜9・0 が上から10個のランク。ランク名が1文字ならその文字のキーでも選べる
function qcKeys() {
  const map = {}, hints = [];
  state.tiers.forEach((t, i) => {
    const ks = [];
    if (i < 10) { const d = String((i + 1) % 10); map[d] = i; ks.push(d); }
    const nm = t.name.trim();
    if ([...nm].length === 1 && !/^[0-9]$/.test(nm) && !(nm.toLowerCase() in map)) { map[nm.toLowerCase()] = i; ks.push(nm); }
    hints[i] = ks;
  });
  return { map, hints };
}
$("#qcBtn").onclick = () => {
  if (!Object.keys(state.cards).length) { say("画像がまだありません"); return; }
  if (qc) {
    qc.queue = qc.queue.filter(id => state.cards[id]);
    qcdlg.showModal();
    if (qc.queue.length) renderQcPause(); else renderQcDone();
    return;
  }
  if (!state.pool.length) qcOpt.scope = "all";
  qcdlg.showModal(); renderQcSetup();
};
function renderQcSetup() {
  qcdlg.dataset.screen = "setup";

    <div class="cmp-opt">
      <label><input type="radio" name="qcscope" value="pool" ${qcOpt.scope === "pool" ? "checked" : ""} ${np ? "" : "disabled"}> 未配置の画像(${np} 枚)</label>
      <label><input type="radio" name="qcscope" value="all" ${qcOpt.scope === "all" ? "checked" : ""}> すべての画像(${na} 枚。選んだ画像はそのランクの最後に移ります)</label>
    </div>

      ① <b>キーボード</b>:数字キー(1〜90)かランク名の文字キー(「S」など1文字のランク名のとき)<br>
      ② <b>クリック</b>:ランク名のボタンをクリック<br>

    <div class="cmp-foot"><button class="primary" data-qc="start" ${(qcOpt.scope === "pool" ? np : na) ? "" : "disabled"}>始める</button><button data-qc="close">閉じる</button></div>`;
}
function qcStart() {
  let ids = (qcOpt.scope === "pool" ? state.pool.slice() : readingOrder()).filter(id => state.cards[id]);
  if (qcOpt.order === "random") shuffle(ids);
  qc = { total: ids.length, queue: ids, log: [], skips: 0, cur: 0 };
  touch(); updateQcBtn(); renderQcRun();
}
function renderQcRun() {
  if (!qc.queue.length) return renderQcDone();
  qcdlg.dataset.screen = "run";
  const id = qc.queue[0], c = state.cards[id], { hints } = qcKeys();
  qc.cur = Math.max(0, Math.min(qc.cur, state.tiers.length - 1));
  const done = qc.total - qc.queue.length, pct = Math.floor(done / Math.max(1, qc.total) * 100), last = qc.log[qc.log.length - 1];
  const lastTxt = !last ? "" : last.t === "c"
    ? `直前:「${esc(state.cards[last.id]?.name ?? "")}」→ ${esc(state.tiers.find(t => t.id === last.tid)?.name ?? "")}`
    : "直前:「あとで」にしました";
  qcdlg.innerHTML = `
    <div class="cmp-head"><span>分類済み ${done} / ${qc.total}</span><div class="cmp-bar"><i style="width:${pct}%"></i></div></div>
    <div class="qc-body"><img class="qc-img" src="${imgUrl(c)}" alt=""><p class="lb-cap">${esc(c.name)}</p></div>
    <p class="cmp-hint" style="margin:4px 0">${lastTxt}</p>
    <div class="qc-ranks">${state.tiers.map((t, i) => `<button class="qc-rank${i === qc.cur ? " cur" : ""}" data-qc="pick" data-i="${i}" tabindex="-1"><span class="qc-key">${esc(hints[i].join(" / "))}</span><span class="qc-nm" style="background:${t.color};color:${ink(t.color)}">${esc(t.name)}</span><small>${t.items.length} 枚</small></button>`).join("")}</div>
    <div class="cmp-foot"><button data-qc="skip" ${qc.queue.length > 1 ? "" : "disabled"}>あとで(飛ばす)</button><button data-qc="undo" ${qc.log.length ? "" : "disabled"}>一つ戻る</button><button data-qc="pause">中断する</button></div>
    <p class="cmp-hint">キーボード:数字キーかランク名の文字キーで決定 / ← → ↑ ↓ で選んでEnter で決定 / Space:あとで / Backspace:一つ戻る / Esc:閉じる(進捗は残ります)</p>`;
}
function qcPick(i) {
  const t = state.tiers[i];
  if (!t || !qc || !qc.queue.length) return;
  const id = qc.queue.shift(), loc = locate(id);
  removeFromAll(id); t.items.push(id);
  qc.log.push({ t: "c", id, tid: t.id, wh: loc.wh, ix: loc.ix });
  qc.cur = i; touch(); updateQcBtn(); renderQcRun();
}
function qcSkip() {   // 後ろに回してあとでもう一度出す
  if (!qc || qc.queue.length < 2) return;
  const id = qc.queue.shift();
  qc.queue.push(id); qc.log.push({ t: "s", id }); qc.skips++;
  touch(); renderQcRun();
}
function qcUndo() {
  if (!qc) return;
  const e = qc.log.pop();
  if (!e) return;
  if (e.t === "s") {
    const k = qc.queue.lastIndexOf(e.id);
    if (k >= 0) { qc.queue.splice(k, 1); qc.queue.unshift(e.id); }
    qc.skips = Math.max(0, qc.skips - 1);
  } else if (state.cards[e.id]) { putAt(e.id, e.wh, e.ix); qc.queue.unshift(e.id); }
  touch(); updateQcBtn(); renderQcRun();
}
function renderQcPause() {
  qcdlg.dataset.screen = "pause";
  const done = qc.total - qc.queue.length;
  qcdlg.innerHTML = `
    <div class="cmp-head"><span>分類済み ${done} / ${qc.total}</span><div class="cmp-bar"><i style="width:${Math.floor(done / Math.max(1, qc.total) * 100)}%"></i></div></div>
    <p class="cmp-q">中断中</p>
    <p class="cmp-hint" style="text-align:center">残り ${qc.queue.length} 枚です。分類した画像はもう表に入っています</p>
    <ul class="plan">${state.tiers.map(t => `<li>${chip(t)} ${t.items.length} 枚</li>`).join("")}<li><b>未配置</b> ${state.pool.length} 枚</li></ul>
    <div class="cmp-foot"><button class="primary" data-qc="resume">続きから再開</button><button data-qc="undo" ${qc.log.length ? "" : "disabled"}>一つ戻る</button><button data-qc="close">閉じる</button><button data-qc="restart">最初からやり直す</button></div>
    <p class="cmp-hint">「閉じる」を押しても進捗は残ります。「表を保存」で保存すればあとで読み込んで続きから再開できます</p>`;
}
function renderQcDone() {
  qcdlg.dataset.screen = "done";
  qcdlg.innerHTML = `
    <p class="cmp-q">クイック分類が終わりました</p>
    <ul class="plan">${state.tiers.map(t => `<li>${chip(t)} ${t.items.length} 枚</li>`).join("")}<li><b>未配置</b> ${state.pool.length} 枚</li></ul>
    <div class="cmp-foot"><button class="primary" data-qc="finish">閉じる</button><button data-qc="undo" ${qc && qc.log.length ? "" : "disabled"}>一つ戻る</button></div>`;
}
function qcMoveCursor(key) {
  const btns = [...qcdlg.querySelectorAll(".qc-rank")];
  if (!btns.length) return;
  let i = qc.cur;
  if (key === "ArrowLeft") i = Math.max(0, i - 1);
  else if (key === "ArrowRight") i = Math.min(btns.length - 1, i + 1);
  else {   // 上下:その向きにある行のうちいちばん近いもの(同じ位置に近い横位置を優先)
    const rs = btns.map(b => b.getBoundingClientRect()), me = rs[i], cx = me.left + me.width / 2;
    let best = -1, bd = Infinity;
    rs.forEach((r, j) => {
      const dy = key === "ArrowDown" ? r.top - me.top : me.top - r.top;
      if (dy < me.height / 2) return;
      const d = dy * 4 + Math.abs(r.left + r.width / 2 - cx);
      if (d < bd) { bd = d; best = j; }
    });
    if (best >= 0) i = best;
  }
  qc.cur = i;
  btns.forEach((b, j) => b.classList.toggle("cur", j === i));
}
qcdlg.addEventListener("click", e => {
  const b = e.target.closest("[data-qc]");
  if (!b) return;
  const a = b.dataset.qc;
  if (a === "close") qcdlg.close();
  else if (a === "start") qcStart();
  else if (a === "pick") qcPick(+b.dataset.i);
  else if (a === "skip") qcSkip();
  else if (a === "undo") qcUndo();
  else if (a === "pause") renderQcPause();
  else if (a === "resume") renderQcRun();
  else if (a === "restart") {
    if (!confirm("分類の進み具合を捨てて最初から選び直します。\n(すでに分類した画像はそのまま表に入っています。)よろしいですか?")) return;
    qc = null; touch(); updateQcBtn(); renderQcSetup();
  }
  else if (a === "finish") { qc = null; touch(); updateQcBtn(); qcdlg.close(); }
});
qcdlg.addEventListener("change", e => {
  if (e.target.name === "qcscope") { qcOpt.scope = e.target.value; renderQcSetup(); }
  else if (e.target.name === "qcorder") qcOpt.order = e.target.value;
});
qcdlg.addEventListener("keydown", e => {
  if (!qc || qcdlg.dataset.screen !== "run" || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  const k = e.key, { map } = qcKeys();
  if (k === "Enter") { e.preventDefault(); qcPick(qc.cur); }
  else if (k === " ") { e.preventDefault(); qcSkip(); }
  else if (k === "Backspace") { e.preventDefault(); qcUndo(); }
  else if (k.startsWith("Arrow")) { e.preventDefault(); qcMoveCursor(k); }
  else if (k.length === 1 && k.toLowerCase() in map) { e.preventDefault(); qcPick(map[k.toLowerCase()]); }
});
qcdlg.addEventListener("close", () => { render(); updateQcBtn(); });   // 閉じたら分類した結果を表に反映して描き直す

/* ---------- バージョン(名前を付けてブラウザの中に残す・戻す・比べる) ---------- */
const MAX_VERS = 30;
let versions = [];   // [{ id, name, savedAt, count, tiers, imgIds, meta }] 新しい順
const verdlg = $("#verdlg");
const verRefs = () => new Set(versions.flatMap(v => v.imgIds));
async function loadVersions() {
  const arr = await idbTx(["vers"], "readonly", tx => tx.objectStore("vers").getAll());
  versions = (arr || []).sort((a, b) => b.savedAt - a.savedAt);
}
const stamp = () => new Date().toLocaleString("ja-JP");
async function saveVersion(name) {   // 今の状態(画像を除く)を記録しまだ保存していない画像だけを書き込む
  const ids = Object.keys(state.cards);
  await ensureStored();
  const add = ids.filter(id => !storedImgs.has(id)).map(id => [id, state.cards[id].src]);
  const rec = { id: uid() + Date.now().toString(36), name, savedAt: Date.now(), count: ids.length, tiers: state.tiers.length, imgIds: ids, meta: buildMeta(false) };
  await idbTx(["vers", "imgs"], "readwrite", tx => {
    const im = tx.objectStore("imgs");
    add.forEach(([id, src]) => im.put(src, id));
    tx.objectStore("vers").put(rec, rec.id);
  });
  add.forEach(([id]) => storedImgs.add(id));
  versions.unshift(rec);
}
async function dropVersion(v) {   // 記録を消しどこからも使われなくなった画像も消す
  versions = versions.filter(x => x.id !== v.id);
  const keep = new Set([...Object.keys(state.cards), ...verRefs()]);
  try { const m = await idbGetMeta(); if (m) Object.keys(m.cardsMeta || m.cards || {}).forEach(id => keep.add(id)); } catch (e) {}
  const del = v.imgIds.filter(id => !keep.has(id));
  await idbTx(["vers", "imgs"], "readwrite", tx => { tx.objectStore("vers").delete(v.id); const im = tx.objectStore("imgs"); del.forEach(id => im.delete(id)); });
  del.forEach(id => storedImgs.delete(id));
}
async function restoreVersion(v) {
  if (Object.keys(state.cards).length) {   // 戻す前に今の状態をバックアップとして残す
    if (versions.length >= MAX_VERS) {
      const old = [...versions].reverse().find(x => x.name.startsWith("復元前のバックアップ") && x.id !== v.id);
      if (old) await dropVersion(old);
    }
    if (versions.length < MAX_VERS) await saveVersion("復元前のバックアップ " + stamp());
    else if (!confirm(`バージョンが上限(${MAX_VERS}個)に達しているため今の状態をバックアップできません。\nバックアップなしでこの状態に戻しますか?`)) return false;
  }
  const out = await idbTx(["imgs"], "readonly", tx => { const st = tx.objectStore("imgs"); return Object.fromEntries(v.imgIds.map((id, i) => [i, st.get(id)])); });
  const cards = {};
  v.imgIds.forEach((id, i) => { if (out[i] && v.meta.cardsMeta[id]) cards[id] = { src: out[i], ...v.meta.cardsMeta[id] }; });
  const { cardsMeta, ...rest } = v.meta;
  loadedOk = false;
  await $("#load").onchange({ target: { files: [new File([JSON.stringify({ ...rest, cards })], "version.json", { type: "application/json" })], value: "" } });
  if (loadedOk) dirty = true;
  return loadedOk;
}
// 2つの状態の違い(追加・削除・ランクの移動・名前やタグや評価の変更・ランクごとの枚数)
function metaLoc(meta) {
  const loc = {};
  (meta.tiers || []).forEach(t => (t.items || []).forEach(id => { loc[id] = t.name; }));
  (meta.pool || []).forEach(id => { loc[id] = "未配置"; });
  return loc;
}
function diffMeta(A, B) {
  const la = metaLoc(A), lb = metaLoc(B), ca = A.cardsMeta || {}, cb = B.cardsMeta || {};
  const added = Object.keys(cb).filter(id => !(id in ca)).map(id => cb[id].name), removed = Object.keys(ca).filter(id => !(id in cb)).map(id => ca[id].name);
  const moved = [], changed = [];
  Object.keys(cb).forEach(id => {
    if (!(id in ca)) return;
    if (la[id] !== lb[id]) moved.push({ name: cb[id].name, from: la[id], to: lb[id] });
    const a = ca[id], b = cb[id], parts = [];
    if (a.name !== b.name) parts.push("名前");
    if (JSON.stringify(a.tags || []) !== JSON.stringify(b.tags || [])) parts.push("タグ");
    if (JSON.stringify(a.sc || null) !== JSON.stringify(b.sc || null)) parts.push("評価点数");
    if (parts.length) changed.push({ name: b.name, parts });
  });
  const names = [...new Set([...(A.tiers || []).map(t => t.name), ...(B.tiers || []).map(t => t.name), "未配置"])];
  const count = (m, nm) => nm === "未配置" ? (m.pool || []).length : (m.tiers || []).filter(t => t.name === nm).reduce((x, t) => x + t.items.length, 0);
  return { added, removed, moved, changed, counts: names.map(nm => [nm, count(A, nm), count(B, nm)]) };
}
function renderVerCompare(l1, A, l2, B) {
  const d = diffMeta(A, B), lst = (arr, max = 40) => arr.length ? esc(arr.slice(0, max).join("・")) + (arr.length > max ? ` …ほか ${arr.length - max} 件` : "") : "なし";
  verdlg.innerHTML = `
    <p class="cmp-q">バージョンの比較</p>
    <p class="cmp-hint" style="text-align:center">${esc(l1)} → ${esc(l2)}</p>
    <h3 style="font-size:14px;margin:8px 0 4px">ランクごとの枚数</h3>
    <div class="stat-wrap"><table class="stat-t"><thead><tr><th>ランク</th><th>${esc(l1)}</th><th>${esc(l2)}</th><th>差</th></tr></thead><tbody>${d.counts.map(([n, a, b]) => `<tr><td>${esc(n)}</td><td>${a}</td><td>${b}</td><td>${b - a > 0 ? "+" : ""}${b - a}</td></tr>`).join("")}</tbody></table></div>
    <h3 style="font-size:14px;margin:8px 0 4px">追加された画像(${d.added.length})</h3><div class="ver-names">${lst(d.added)}</div>
    <h3 style="font-size:14px;margin:8px 0 4px">なくなった画像(${d.removed.length})</h3><div class="ver-names">${lst(d.removed)}</div>
    <h3 style="font-size:14px;margin:8px 0 4px">ランクが変わった画像(${d.moved.length})</h3><div class="ver-names">${lst(d.moved.map(m => `${m.name}(${m.from} → ${m.to})`), 60)}</div>
    <h3 style="font-size:14px;margin:8px 0 4px">名前・タグ・評価点数が変わった画像(${d.changed.length})</h3><div class="ver-names">${lst(d.changed.map(m => `${m.name}(${m.parts.join("・")})`))}</div>
    <div class="cmp-foot"><button class="primary" data-vr="back">一覧に戻る</button></div>`;
}
async function renderVerList() {
  try { await loadVersions(); } catch (e) {}
  verdlg.innerHTML = `
    <p class="cmp-q">バージョン(残す・戻す・比べる)</p>

    <div class="bk-row"><input id="ver-name" type="text" maxlength="40" placeholder="名前(空欄なら日時が入ります)" autocomplete="off"><button class="primary" data-vr="save">今の状態を残す</button></div>

  try {

}

}
async function shrinkSrc(src, max) {   // 共有用に画像を小さくする
  const img = await loadImg(src), r = Math.min(1, max / Math.max(img.width, img.height));

  c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/webp", 0.8);
}

  const rows = state.tiers.map(t => ({ name: t.name, color: t.color, border: t.border || t.color, ids: t.items.filter(id => state.cards[id]) }));
  if (o.pool && state.pool.length) rows.push({ name: "未配置", color: th.poolLabel, border: th.poolLabel, ids: state.pool.filter(id => state.cards[id]) });

      ...(o.scores && g ? { sc: g.items.map(([k, l]) => [l, scoreOf(c, k)]), tot: total } : {}),
      ...(o.memo && c.memo ? { m: c.memo } : {}), ...(o.badge && bv !== null ? { b: bv, bs: rateStyle(bv) } : {}) };
    if (++n % 10 === 0) { progress(n, all.length); await new Promise(r => setTimeout(r)); }
  }
  const data = { title: state.title, genre: genreLabel(), theme: th, rows: rows.map(r => ({ name: r.name, color: r.color, border: r.border, ink: ink(r.color), ids: r.ids })), cards, id: Math.random().toString(36).slice(2, 10),
    v: { cs: state.cardSize, per: state.perRow || capacityNow() || 8, tfs: Math.round(parseFloat(getComputedStyle($("#title")).fontSize)) || 26, nfs: Math.round(parseFloat(getComputedStyle(document.querySelector(".card textarea") || document.body).fontSize)) || 12 },
    o: { n: !!o.names, ln: !!o.lbNames, c: !!o.count, t: !!o.tags } };

}

// 画像のデータ(長い文字列)をHTMLにそのまま埋め込むと描き直すたびにとても重くなる。
// 短いURLに変えて画像の管理はブラウザに任せる。データ本体(c.src)は保存・書き出し・重複チェックに使う
const urlMap = new WeakMap();
let urlList = [];
function blobFromDataUrl(d) {
  const i = d.indexOf(","), mime = d.slice(5, d.indexOf(";")) || "image/webp", bin = atob(d.slice(i + 1)), u = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
  return new Blob([u], { type: mime });
}
function imgUrl(c) {
  if (!c) return "";

  if (!u) {
    try { u = URL.createObjectURL(blobFromDataUrl(c.src)); } catch (e) { u = c.src; }
    urlMap.set(c, u); urlList.push({ c, u });
  }

}
function pruneUrls() {   // 表を読み込み直したあと使わなくなった画像のURLを解放する
  const live = new Set(Object.values(state.cards));
  urlList = urlList.filter(e => { if (live.has(e.c)) return true; if (e.u.startsWith("blob:")) URL.revokeObjectURL(e.u); return false; });
}

  scOpt.range = Array.from({ length: n - 1 }, (_, i) => Math.round(mx - (mx - mn) * (i + 1) / n));

function scPlan() {   // 各画像が入るランクを決める(下限・割合の境目の点数は、上のランクへ入る)

/* ---------- 表内の画像を保存(新しいフォルダに) ---------- */
const crcTable = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u => { let c = -1; for (let i = 0; i < u.length; i++) c = crcTable[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ -1) >>> 0; };
function makeZip(files) {   // 圧縮なしのZIP(フォルダ付きの名前で入れる)
  const enc = new TextEncoder(), parts = [], central = [];
  const u16 = n => [n & 255, (n >> 8) & 255], u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const local = new Uint8Array([0x50, 0x4b, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(size), ...u32(size), ...u16(name.length), ...u16(0)]);
    parts.push(local, name, f.data); central.push({ name, crc, size, offset }); offset += local.length + name.length + size;
  }
  const cStart = offset;
  for (const c of central) {
    const h = new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c.crc), ...u32(c.size), ...u32(c.size), ...u16(c.name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(c.offset)]);
    parts.push(h, c.name); offset += h.length + c.name.length;
  }
  parts.push(new Uint8Array([0x50, 0x4b, 5, 6, 0, 0, 0, 0, ...u16(central.length), ...u16(central.length), ...u32(offset - cStart), ...u32(cStart), 0, 0]));

const safeName = (t, d) => String(t || "").replace(/[\\/:*?"<>|\u0000-\u001f]/g, "_").replace(/^\.+/, "").trim().slice(0, 60) || d;
const SAVE_EXT = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "image/gif": "gif", "image/avif": "avif", "image/bmp": "bmp", "image/svg+xml": "svg" };
async function saveAllImages() {
  const ids = [...state.tiers.flatMap(t => t.items), ...state.pool].filter(id => state.cards[id]);
  if (!ids.length) { say("保存できる画像がありません"); return; }
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const folder = `${safeName(state.title, "ティア表")}_画像_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
  let dir = null;
  if (window.showDirectoryPicker) {   // 保存先を選ぶと、その中に新しいフォルダを作る

    catch (e) { if (e.name === "AbortError") return; dir = null; }
  }
  const used = new Set(), files = [];
  for (let i = 0; i < ids.length; i++) {
    say(`画像を保存しています(${i + 1}/${ids.length})`);
    const c = state.cards[ids[i]], blob = await (await fetch(c.src)).blob();
    const ext = SAVE_EXT[blob.type] || (blob.type.split("/")[1] || "img").replace(/\+.*/, ""), base = safeName(c.name, "画像");

  say(dir ? `表内の画像${ids.length}枚を、フォルダ「${folder}」に保存しました` : `表内の画像${ids.length}枚を、フォルダ「${folder}」を含むZIPファイルとして保存しました`);
}
